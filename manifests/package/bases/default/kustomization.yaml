apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole-read.yaml
  - deployment.yaml
# k8sbot's environment, but for its key, as an AppConfig/Env file. Each
# controller component merges its own variables in. The installer uploads the
# ConfigMap as an AppConfig Unit that ConfigHub renders into it; with no name
# suffix, ConfigHub renders it in place, under this name, which the Deployment
# reads with envFrom.
configMapGenerator:
  - name: k8sbot-env
    namespace: confighubplaceholder
    envs:
      - k8sbot.env
    options:
      disableNameSuffixHash: true
      annotations:
        confighub.com/toolchain: AppConfig/Env
# Override with installer setup --set-image ghcr.io/confighub/k8sbot=<image>.
images:
  - name: ghcr.io/confighub/k8sbot
    newName: ghcr.io/confighub/k8sbot
    newTag: v0.2.8
