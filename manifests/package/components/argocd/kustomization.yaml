apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - role.yaml
patches:
  # The variables k8sbot reads to drive Argo CD, as manifests/k8sbot.yaml
  # sets them. ARGO_NAMESPACE must be the Role's namespace.
  - target:
      kind: Deployment
      name: k8sbot
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: k8sbot
      spec:
        template:
          spec:
            containers:
              - name: k8sbot
                env:
                  - name: GITOPS_CONTROLLER
                    value: argocd
                  - name: ARGO_NAMESPACE
                    value: argocd
                  - name: ARGO_REFRESH_TYPE
                    value: hard
